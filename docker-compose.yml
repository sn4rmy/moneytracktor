services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moneytracktor}
      POSTGRES_USER: ${POSTGRES_USER:-moneytracktor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moneytracktor}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-key}
      DATABASE_URL: postgres://${POSTGRES_USER:-moneytracktor}:${POSTGRES_PASSWORD:-moneytracktor}@db:5432/${POSTGRES_DB:-moneytracktor}
      CELERY_BROKER_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build: .
    command: celery -A config worker --loglevel=info
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-key}
      DATABASE_URL: postgres://${POSTGRES_USER:-moneytracktor}:${POSTGRES_PASSWORD:-moneytracktor}@db:5432/${POSTGRES_DB:-moneytracktor}
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
